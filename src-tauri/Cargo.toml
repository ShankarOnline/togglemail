[package]
name = "togglemail"
version = "0.1.2"
description = "ToggleMail - a desktop email app for any IMAP, POP3 and SMTP service"
authors = ["Shankar Raj"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ShankarOnline/togglemail"
edition = "2021"

[lib]
name = "togglemail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros"] }
futures = "0.3"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
mail-parser = "0.11"
ammonia = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dirs = "6"
base64 = "0.22"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
