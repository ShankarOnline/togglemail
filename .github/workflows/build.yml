name: Build installers

# Runs on every push to main and on version tags (v0.1.0 ...). Tags also publish a draft release
# with the installers attached; plain pushes keep them as workflow artifacts.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          # 22.04 keeps glibc old enough for Ubuntu 22.04+, Pop!_OS 22.04/24.04 (COSMIC), Debian 12, Fedora, Mint.
          - platform: ubuntu-22.04
            args: ''
          # ARM64 Linux: Raspberry Pi 4/5 with 64-bit Raspberry Pi OS (Debian 12+), Ubuntu on ARM.
          - platform: ubuntu-22.04-arm
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libdbus-1-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'ToggleMail ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  # FreeBSD has no Tauri installer format: this builds the program in a FreeBSD VM and packs it
  # as a .tar.gz (needs: pkg install webkit2-gtk_41 gtk3 librsvg2-rust dbus gnome-keyring).
  freebsd:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          mem: 8192
          prepare: |
            pkg install -y rust pkgconf webkit2-gtk_41 gtk3 librsvg2-rust dbus libsoup3 gettext-runtime
            # bzip2 is part of FreeBSD's base system but has no pkg-config file, which freetype2's needs.
            mkdir -p /usr/local/libdata/pkgconfig
            printf 'prefix=/usr\nlibdir=${prefix}/lib\nincludedir=${prefix}/include\n\nName: bzip2\nDescription: bzip2 from the base system\nVersion: 1.0.8\nLibs: -L${libdir} -lbz2\nCflags: -I${includedir}\n' > /usr/local/libdata/pkgconfig/bzip2.pc
          run: |
            cd src-tauri
            cargo build --release
            mkdir -p ../dist/ToggleMail
            cp target/release/togglemail ../dist/ToggleMail/
            cp icons/128x128.png ../dist/ToggleMail/togglemail.png
            printf '[Desktop Entry]\nName=ToggleMail\nExec=togglemail\nIcon=togglemail\nType=Application\nCategories=Network;Email;\n' > ../dist/ToggleMail/togglemail.desktop
            cd ../dist && tar czf ToggleMail-freebsd-amd64.tar.gz ToggleMail
      - uses: actions/upload-artifact@v4
        with:
          name: installers-freebsd
          path: dist/ToggleMail-freebsd-amd64.tar.gz
          if-no-files-found: ignore

  # Ubuntu App Centre (Snap Store). The .snap is kept as an artifact; uploading it to the store
  # (snapcraft upload --release=edge) is done with the owner's own Snap Store login.
  snap:
    strategy:
      fail-fast: false
      matrix:
        # amd64 PCs, and arm64 for Raspberry Pi 4/5 and other ARM boards.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snapcraft
      - uses: actions/upload-artifact@v4
        with:
          name: installers-snap-${{ matrix.runner }}
          path: ${{ steps.snapcraft.outputs.snap }}

  # Flathub (GNOME Software): builds the Flatpak the way Flathub does, offline from cargo-sources.json.
  flatpak:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: togglemail.flatpak
          manifest-path: packaging/flatpak/com.toggleminds.togglemail.yml
          cache-key: flatpak-builder-${{ github.sha }}
